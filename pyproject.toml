[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noticedesk-eval"
version = "0.1.0"
description = "Notice Desk model lab in Python: replay router policies over recorded LLM answers, score, Pareto, recommend."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["noticedesk_eval"]

[tool.setuptools.package-data]
noticedesk_eval = ["fixture.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
